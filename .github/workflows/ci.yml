name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Unit tests run against the built output in lib/, so they also guard the
      # shape the deployment actually loads.
      - run: pnpm test
      # Syntax sanity for the client bundle (it ships as .tsx source and is
      # bundled by the consuming deployment, but must at least parse).
      - run: node --experimental-strip-types --check src/index.ts
      - name: Smoke (optional — only when a gateway is reachable)
        if: ${{ vars.DSH_AGW_BASE != '' }}
        env:
          DSH_AGW_BASE: ${{ vars.DSH_AGW_BASE }}
          DSH_AGW_KEY: ${{ secrets.DSH_AGW_KEY }}
        run: pnpm smoke

  # Standalone API stack (docker compose): build the node image from this checkout,
  # boot nginx + gateway, and run the zero-dependency wiring smoke through the front
  # door. No model key in CI — the smoke covers health/auth/whitelist/envelopes/mux,
  # not real turns. Container-semantics regressions (uid, volume seeding, nginx
  # upgrade path) are exactly what a local-no-docker dev machine cannot catch.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate .env
        run: bash docker/gen-env.sh
      - name: Build the stack
        run: docker compose build
      - name: Boot the stack (waits for the gateway healthcheck)
        run: docker compose up -d --wait --timeout 420
      - name: Stack smoke (wiring only)
        run: node docker/smoke.mjs
      # Web demos (examples/demos): boot the compose overlay on top of the running
      # stack and check the BFF wiring — pages, health, seeded tree. Model turns are
      # not exercised in CI (no key); the live-host verification covers those.
      - name: Boot the web demos (compose overlay)
        run: |
          mkdir -p workspaces/kb workspaces/cs
          docker compose -f docker-compose.yml -f examples/demos/compose.demos.yml up -d --build
      - name: Demo smoke (BFF wiring)
        run: |
          set -e
          PORT=$(grep '^HTTP_PORT=' .env | cut -d= -f2- || echo 80)
          ok=0
          for i in $(seq 1 45); do
            ok=1
            for p in /kb/ /cs/ /kb/api/health /cs/api/health; do
              curl -fsS "http://127.0.0.1:${PORT}$p" -o /dev/null || ok=0
            done
            [ "$ok" = 1 ] && break
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "demo endpoints never came up"; exit 1; }
          curl -fsS "http://127.0.0.1:${PORT}/kb/api/tree" | grep -q 'content/docs/README.md'
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/" --max-time 5)
          [ "$code" = 404 ] || { echo "front door must stay fail-closed: / returned $code"; exit 1; }
          echo DEMOS-OK
      - name: Compose logs (on failure)
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f examples/demos/compose.demos.yml logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
