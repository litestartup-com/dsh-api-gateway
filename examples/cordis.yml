# 示例：把 dsh-api-gateway（loopback proxy 形态）加进你的宿主组合（host composition）。
#
# 你的部署已有完整的宿主组合文件（cordis.yml）——不要整体替换，只需把
# `dsh-api-gw` 这一行加进去（行格式与现有行保持一致），然后重启。
#
# 平面归属：该插件发布跨会话共享的 HTTP 服务，必须挂在宿主组合，
# 不能放进任何 agent preset。

# 部署自带的 HTTP 载体行（示例，按你现有配置为准）：
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: 127.0.0.1
    port: 3080

# ……你的部署其余宿主行（agent-loop、sessions、sandbox、llm 路由等）……

# API Gateway 行 —— 把它复制进你的组合：
- id: dsh-api-gw
  name: dsh-api-gateway
  config:
    prefix: /api-gw/v1          # 网关路由前缀（注册在 webServer 载体上）
    enabled: true               # 主开关；也可运行时经 admin 端点软开关
    apiKeys: []                 # 可选：预置静态 API 密钥（跨机客户端用）
    allowKeyProvision: true     # 允许首次 POST /key 自助发放密钥（一次性）
    adminKey: change-me         # 可选：设置后启用 admin 端点
    corsOrigin: '*'             # 可选：CORS 源（公开部署建议收敛）
    exposeErrors: true          # 可选：错误响应是否带内部细节（公开部署建议 false）
    proxyTarget: http://127.0.0.1:3080/api   # 上游 /api 基础地址（一般不动）
    # proxyWhitelist: [...]     # 可选：覆盖默认白名单（默认见 README）

# 卸载 = 删除上面这一行（可选 dsh plugin remove dsh-api-gateway），重启。
