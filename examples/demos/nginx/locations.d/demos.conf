# Demo app locations — included inside the server block of gateway.conf via
# /etc/nginx/conf.d/locations.d/*.conf (mounted by compose.demos.yml).
#
# BFF pattern: browsers talk only to these small demo servers; the BFFs hold the
# facade API key and call the gateway over the internal network. SSE streams need
# buffering off; the 15s heartbeats keep the 300s read timeout from firing.

location /kb/ {
    set $kb_demo http://kb-demo:8101;
    rewrite ^/kb/(.*)$ /$1 break;
    proxy_pass $kb_demo;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
location = /kb { return 302 /kb/; }

location /cs/ {
    set $cs_demo http://cs-demo:8102;
    rewrite ^/cs/(.*)$ /$1 break;
    proxy_pass $cs_demo;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
location = /cs { return 302 /cs/; }
