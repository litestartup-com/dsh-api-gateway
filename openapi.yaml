openapi: 3.0.3
info:
  title: dsh-api-gateway (loopback proxy)
  version: 0.2.0
  description: >
    Authenticated, fail-closed loopback proxy over the DeepSeek Harness /api
    (apiproxy) surface. Unary calls and respond pass through verbatim; the mux
    is a downlink-only WebSocket pipe. Wire envelopes belong to apiproxy, not
    to this proxy: the proxy only checks the method name on the path.
servers:
  - url: http://127.0.0.1:3080/api-gw/v1
paths:
  /health:
    get:
      summary: Plugin status and upstream liveness
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, disabled] }
                  enabled: { type: boolean }
                  upstream: { type: string, enum: [ok, unreachable] }
                  apiKeySet: { type: boolean }
  /key:
    post:
      summary: One-time key bootstrap (only while no key exists at all)
      security: []
      responses:
        '200':
          description: key minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey: { type: string }
                  persisted: { type: boolean }
        '403':
          description: already provisioned or provisioning disabled
  /admin/enable:
    post:
      summary: Runtime master switch (X-Admin-Key)
      responses:
        '200': { description: toggled }
        '401': { description: admin_unauthorized }
  /admin/rotate-key:
    post:
      summary: Rotate the provisioned key (X-Admin-Key)
      responses:
        '200':
          description: new key
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey: { type: string }
                  persisted: { type: boolean }
  /proxy/{method}:
    post:
      summary: Unary apiproxy passthrough (whitelisted methods only)
      parameters:
        - name: method
          in: path
          required: true
          schema: { type: string }
          description: >
            One of: session.list, session.create, session.history, session.prompt,
            session.cancel, session.rename, session.fork, session.updateQueue,
            session.attachment, session.models, session.selectModel, respond,
            host.describe
      security:
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: apiproxy server-response, verbatim }
        '401': { description: unauthorized }
        '403': { description: method_not_allowed (whitelist) }
        '502': { description: upstream_unreachable }
  /events.mux:
    get:
      summary: >
        Mux WebSocket downlink (X-API-Key in the upgrade headers). Downlink
        only: any client frame closes the socket with 1008.
      description: >
        Also registered at /proxy/events.mux so clients whose base is the
        proxy prefix derive the mux URL uniformly.
      security:
        - ApiKey: []
      responses:
        '101': { description: Switching Protocols; server-request frames follow }
        '401': { description: upgrade refused before protocol negotiation }
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    BearerKey:
      type: http
      scheme: bearer
